# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  docker-compose.override.yml — CHẾ ĐỘ DEV                                ║
# ║                                                                          ║
# ║  Docker Compose TỰ ĐỘNG đọc file này khi chạy `docker compose up`.        ║
# ║  Không cần cờ gì thêm. Muốn build đúng bản production (không override):   ║
# ║      docker compose -f docker-compose.yml up --build                      ║
# ║                                                                          ║
# ║  Mục đích: bind-mount source vào container để SỬA CODE KHÔNG CẦN BUILD    ║
# ║  LẠI IMAGE. Streamlit tự reload khi file thay đổi.                        ║
# ║                                                                          ║
# ║  Vòng lặp dev điển hình:                                                  ║
# ║    1. docker compose up            → chạy 1 lần, để đó                    ║
# ║    2. sửa code trên máy host       → Streamlit tự reload, KHÔNG build lại ║
# ║    3. cần thư viện mới:                                                   ║
# ║         docker compose exec app uv pip install <pkg>                      ║
# ║       (có hiệu lực ngay, KHÔNG build lại — nhưng mất khi container xoá)   ║
# ║    4. cuối ngày, ghi lại thư viện mới cho bền:                            ║
# ║         thêm vào requirements.txt                                         ║
# ║         docker compose exec app python scripts/freeze_lock.py             ║
# ║         docker compose up --build     ← chỉ build lại 1 lần ở bước này    ║
# ╚══════════════════════════════════════════════════════════════════════════╝

services:
  app:
    volumes:
      # Toàn bộ source code — sửa trên host, có hiệu lực ngay trong container.
      # Đặt TRƯỚC các named volume bên dưới để không ghi đè chúng.
      - .:/app
      # Giữ nguyên các thư mục cần persist (named volume thắng bind-mount ở
      # đúng đường dẫn con này).
      - rag_processed:/app/processed_data
      - rag_storage:/app/storage
      - rag_models:/cache
    environment:
      # Streamlit hot-reload khi file thay đổi.
      STREAMLIT_SERVER_FILE_WATCHER_TYPE: poll   # 'poll' cần cho bind-mount trên Windows/WSL
      STREAMLIT_SERVER_RUN_ON_SAVE: "true"
      PYTHONDONTWRITEBYTECODE: "1"               # không rải __pycache__ ra source trên host
