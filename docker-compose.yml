# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  Chạy nhanh:   docker compose up --build                                 ║
# ║  Mở:           http://localhost:8501                                     ║
# ║                                                                          ║
# ║  Bật thêm Qdrant (vector DB production):                                 ║
# ║      docker compose --profile qdrant up --build                          ║
# ║  Bật thêm PostgreSQL + pgvector:                                         ║
# ║      docker compose --profile pgvector up --build                        ║
# ╚══════════════════════════════════════════════════════════════════════════╝

services:
  app:
    build:
      context: .
      args:
        # đổi thành "full" nếu cần marker/docling/unstructured/opendataloader
        PROFILE: ${PROFILE:-base}
    image: rag-pipeline-visualizer:${PROFILE:-base}
    ports:
      - "8501:8501"
    env_file:
      - path: .env
        required: false
    environment:
      # trỏ sang service trong compose network (ghi đè localhost)
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql+psycopg://rag:rag@pgvector:5432/ragdb
    volumes:
      # dữ liệu người dùng — đặt PDF của bạn vào ./data
      - ./data:/app/data
      # cache pipeline + index: giữ lại giữa các lần chạy container
      - rag_processed:/app/processed_data
      - rag_storage:/app/storage
      # model HuggingFace/Marker: tải 1 lần, dùng mãi
      - rag_models:/cache
    restart: unless-stopped

  # ── Bản GPU ──────────────────────────────────────────────────────────────
  # Yêu cầu trên HOST: driver NVIDIA + nvidia-container-toolkit
  #   https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/
  # Kiểm tra trước:  docker run --rm --gpus all ubuntu nvidia-smi
  #
  #   TORCH_CUDA=cu124 docker compose --profile gpu up --build
  app-gpu:
    profiles: ["gpu"]
    build:
      context: .
      args:
        PROFILE: ${PROFILE:-full}
        TORCH_CUDA: ${TORCH_CUDA:-cu124}
    image: rag-pipeline-visualizer:gpu
    ports:
      - "8501:8501"
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./data:/app/data
      - rag_processed:/app/processed_data
      - rag_storage:/app/storage
      - rag_models:/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.13.3
    profiles: ["qdrant"]
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  pgvector:
    image: pgvector/pgvector:pg16
    profiles: ["pgvector"]
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: ragdb
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  rag_processed:
  rag_storage:
  rag_models:
  qdrant_data:
  pg_data:
